name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check --select E9,F63,F7,F82 src tests infra
      - run: gcc -shared -fPIC -O2 infra/tailscale_bridge/lk_redirect.c -o /tmp/liblk_redirect.so -ldl
      - run: pytest -q
